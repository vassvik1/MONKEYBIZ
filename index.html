<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MONKEYBIZ Wi‑Fi</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0B1220;--panel:#0F1B2D;--muted:#97A6BA;--text:#E8EEF6;--accent:#55C1FF;--accent2:#3BA5E8;--stroke:rgba(255,255,255,.08);--radius:18px;}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    .wrap{max-width:900px;margin:auto;padding:28px}
    .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    .brand{display:flex;align-items:center;gap:10px}
    .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px rgba(85,193,255,.4)}
    select{appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--stroke);border-radius:12px;padding:10px 12px;font-weight:600}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--stroke);border-radius:var(--radius);padding:22px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
    .grid{display:grid;gap:20px}@media(min-width:820px){.grid{grid-template-columns:300px 1fr}}
    .qr{background:white;border-radius:16px;padding:14px;display:grid;place-items:center}
    .qr img{max-width:256px;width:100%;height:auto}
    .row{display:grid;grid-template-columns:160px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--stroke);border-radius:12px;padding:12px 14px}
    .key{color:var(--muted);font-size:13px}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
    button,a.button{border:1px solid var(--stroke);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:12px;text-decoration:none;font-weight:600;cursor:pointer}
    .primary{background:linear-gradient(180deg,var(--accent),var(--accent2));border:none}
    .hint{color:var(--muted);font-size:13px;margin-top:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="brand"><div class="dot"></div><h1 id="title">MONKEYBIZ Wi‑Fi</h1></div>
      <select id="langSel">
        <option value="no">Norsk</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="pl">Polski</option>
      </select>
    </div>
    <div class="card">
      <p id="intro"></p>
      <div class="grid">
        <div class="qr"><img id="qr" src="MONKEYBIZ-qrcode.png" alt="QR"/></div>
        <div>
          <div class="row"><div class="key" id="kSsid"></div><div class="mono" id="ssid">MONKEYBIZ</div><button onclick="copyText(SSID)" id="copySsid"></button></div>
          <div class="row"><div class="key" id="kSec"></div><div class="mono" id="sec">WPA2/WPA3</div><div></div></div>
          <div class="row"><div class="key" id="kPw"></div><div class="mono" id="pw" data-hidden="true">•••••••••••</div><button id="toggle" onclick="togglePw()"></button></div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">
            <a id="androidLink" class="button primary" href="#"></a>
            <button onclick="copyPayload()" id="copyPayloadBtn"></button>
          </div>
          <p class="hint" id="sameDeviceHint"></p>
        </div>
      </div>
      <p class="hint" id="secNote"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    const SSID='MONKEYBIZ',PASSWORD='Kl0ppabekk!',SECURITY='WPA2';
    const WIFI_PAYLOAD=`WIFI:T:${SECURITY};S:${SSID};P:${PASSWORD};;`;
    const intent=`intent://scan/#Intent;scheme=wifi;S=${SSID};P=${PASSWORD};T=${SECURITY};end`;
    document.getElementById('androidLink').href=intent;

    const i18n={
      intro:{no:'Skann QR‑koden for å koble til automatisk.',en:'Scan the QR code to join automatically.',de:'Scanne den QR‑Code, um automatisch beizutreten.',pl:'Zeskanuj kod QR, aby połączyć się automatycznie.'},
      kSsid:{no:'Nettverk (SSID)',en:'Network (SSID)',de:'Netzwerk (SSID)',pl:'Sieć (SSID)'},
      kSec:{no:'Sikkerhet',en:'Security',de:'Sicherheit',pl:'Zabezpieczenie'},
      kPw:{no:'Passord',en:'Password',de:'Passwort',pl:'Hasło'},
      toggleShow:{no:'Vis',en:'Show',de:'Anzeigen',pl:'Pokaż'},
      toggleHide:{no:'Skjul',en:'Hide',de:'Verbergen',pl:'Ukryj'},
      android:{no:'Android: Trykk for å bli med',en:'Android: Tap‑to‑Join',de:'Android: Tippen zum Beitreten',pl:'Android: Dotknij, aby dołączyć'},
      copyPayloadBtn:{no:'Kopier Wi‑Fi‑streng',en:'Copy Wi‑Fi Payload',de:'Wi‑Fi‑Zeichenfolge kopieren',pl:'Kopiuj ciąg Wi‑Fi'},
      sameDeviceHint:{no:'Hvis du åpner siden på samme enhet, bruk Kodeskanner på iPhone eller bildeikonet på Android.',en:'If opened on the same device, use Code Scanner on iPhone or the photo icon on Android.',de:'Wenn auf demselben Gerät geöffnet, Code‑Scanner auf iPhone oder Fotosymbol auf Android verwenden.',pl:'Jeśli otworzono na tym samym urządzeniu, użyj skanera kodów na iPhonie lub ikony zdjęcia na Androidzie.'},
      secNote:{no:'Sikkerhet: Del privat, roter passord ved behov.',en:'Security: Share privately, rotate password if needed.',de:'Sicherheit: Privat teilen, Passwort bei Bedarf ändern.',pl:'Bezpieczeństwo: Udostępniaj prywatnie, zmieniaj hasło w razie potrzeby.'}
    };

    function applyLang(l){
      document.getElementById('intro').textContent=i18n.intro[l];
      document.getElementById('kSsid').textContent=i18n.kSsid[l];
      document.getElementById('kSec').textContent=i18n.kSec[l];
      document.getElementById('kPw').textContent=i18n.kPw[l];
      document.getElementById('toggle').textContent=i18n.toggleShow[l];
      document.getElementById('androidLink').textContent=i18n.android[l];
      document.getElementById('copyPayloadBtn').textContent=i18n.copyPayloadBtn[l];
      document.getElementById('sameDeviceHint').textContent=i18n.sameDeviceHint[l];
      document.getElementById('secNote').textContent=i18n.secNote[l];
    }

    const sel=document.getElementById('langSel');
    function detectLang(){
      const langs=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'']).map(s=>s.toLowerCase());
      for(const l of langs){
        if(l.startsWith('no')||l.startsWith('nb')||l.startsWith('nn'))return'no';
        if(l.startsWith('pl'))return'pl';
        if(l.startsWith('de'))return'de';
        if(l.startsWith('en'))return'en';
      }return'no';
    }

    const stored=localStorage.getItem('lang');
    const initial=stored||detectLang();
    sel.value=initial;applyLang(initial);
    sel.addEventListener('change',()=>{localStorage.setItem('lang',sel.value);applyLang(sel.value)});

    function togglePw(){
      const pw=document.getElementById('pw');
      const hidden=pw.getAttribute('data-hidden')==='true';
      pw.textContent=hidden?PASSWORD:'•••••••••••';
      pw.setAttribute('data-hidden',hidden?'false':'true');
      document.getElementById('toggle').textContent=hidden?i18n.toggleHide[sel.value]:i18n.toggleShow[sel.value];
    }
    function copyPayload(){navigator.clipboard.writeText(WIFI_PAYLOAD).then(()=>alert('Copied!'));}
  </script>
</body>
</html>
